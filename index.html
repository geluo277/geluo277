    <style>
        /* 基础重置与背景 */
        body {
            margin: 0;
            padding: 0;
            background-color: #f2f2f2; /* 浅灰色背景 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px; /* 限制最大宽度，适配电脑端预览 */
            padding-top: 50px;
            padding-bottom: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            padding-left: 15px;
            padding-right: 15px;
        }

        /* 头像区域 */
        .avatar {
            width: 100px;
            height: 100px;
            background-color: #8a2be2; /* 紫色 */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(138, 43, 226, 0.2);
        }

        /* 名字与认证图标 */
        .name-container {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
        }

        .name {
            font-size: 22px;
            font-weight: bold;
            color: #222;
            margin: 0;
        }

        /* 蓝色认证SVG图标 */
        .verified-icon {
            width: 20px;
            height: 20px;
            fill: #1da1f2; /* 经典推特蓝 */
        }

        /* 简介文字 */
        .description {
            font-size: 14px;
            color: #444;
            text-align: center;
            line-height: 1.6;
            margin: 0 0 35px 0;
            padding: 0 10px;
        }

        /* 链接列表容器 */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px; /* 卡片之间的间距 */
        }

        /* 单个链接卡片 */
        .link-card {
            display: flex;
            align-items: center;
            background-color: #ffffff;
            border-radius: 12px;
            padding: 18px 20px;
            text-decoration: none; /* 去除下划线 */
            color: #222;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); /* 微微的阴影 */
            transition: background-color 0.2s; /* 点击反馈动画 */
        }

        /* 点击时的反馈 */
        .link-card:active {
            background-color: #f8f8f8;
        }

        /* 左侧链接图标 */
        .link-icon {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: #333;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        /* 中间文字部分 */
        .link-text {
            flex: 1;
            text-align: center;
            font-size: 16px;
            font-weight: 500;
            line-height: 1.4;
            padding: 0 10px;
        }

        /* 右侧三个点 */
        .menu-dots {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex-shrink: 0;
        }

        .menu-dots span {
            width: 4px;
            height: 4px;
            background-color: #666;
            border-radius: 50%;
        }
    </style>
