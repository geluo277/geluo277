<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的名片</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --ink: #1e293b;
      --muted: #64748b;
      --radius: 24px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1e1b4b, #312e81 40%, #1e3a8a 70%, #4c1d95);
      background-size: 300% 300%;
      animation: bgShift 20s ease infinite;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 15% 20%, rgba(129, 140, 248, .45), transparent 45%),
        radial-gradient(circle at 85% 15%, rgba(56, 189, 248, .32), transparent 45%),
        radial-gradient(circle at 50% 105%, rgba(192, 132, 252, .42), transparent 55%);
    }

    @keyframes bgShift {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(100%, 430px);
      background: rgba(255, 255, 255, .88);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, .55);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 30px 70px -20px rgba(2, 6, 23, .65);
      animation: cardIn .9s cubic-bezier(.16, 1, .3, 1) both;
      transition: transform .4s ease, box-shadow .4s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 44px 90px -20px rgba(2, 6, 23, .72);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(26px) scale(.97); }
      to   { opacity: 1; transform: none; }
    }

    .banner {
      height: 118px;
      position: relative;
      background: linear-gradient(135deg, #6366f1, #8b5cf6 55%, #06b6d4);
    }

    .banner::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 25% 15%, rgba(255, 255, 255, .5), transparent 55%),
        radial-gradient(circle at 85% 95%, rgba(255, 255, 255, .25), transparent 50%);
    }

    .avatar {
      width: 108px;
      height: 108px;
      margin: -54px auto 0;
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 5px solid #fff;
      background: linear-gradient(135deg, #818cf8, #c084fc 60%, #38bdf8);
      color: #fff;
      font-size: 38px;
      font-weight: 600;
      letter-spacing: 2px;
      box-shadow: 0 12px 30px -6px rgba(99, 102, 241, .65);
    }

    .content {
      padding: 18px 30px 32px;
      text-align: center;
    }

    .name {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: .5px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed 60%, #0ea5e9);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .role {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary-dark);
      background: rgba(99, 102, 241, .12);
      border: 1px solid rgba(99, 102, 241, .25);
      border-radius: 999px;
    }

    .bio {
      margin-top: 16px;
      font-size: 14.5px;
      line-height: 1.8;
      color: var(--muted);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
    }

    .tag {
      padding: 6px 13px;
      font-size: 12.5px;
      color: #4338ca;
      background: #eef2ff;
      border: 1px solid #e0e7ff;
      border-radius: 8px;
      transition: transform .25s ease, background .25s ease;
    }

    .tag:hover {
      transform: translateY(-2px);
      background: #e0e7ff;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 26px;
    }

    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 12px;
      text-decoration: none;
      border: 1px solid transparent;
      transition: transform .25s ease, box-shadow .25s ease,
                  background .25s ease, border-color .25s ease, color .25s ease;
    }

    .btn svg { width: 16px; height: 16px; }

    .btn--primary {
      color: #fff;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      box-shadow: 0 10px 22px -8px rgba(99, 102, 241, .9);
    }

    .btn--primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 28px -8px rgba(99, 102, 241, .95);
    }

    .btn--ghost {
      color: #475569;
      background: #fff;
      border-color: #e2e8f0;
    }

    .btn--ghost:hover {
      transform: translateY(-2px);
      border-color: #c7d2fe;
      color: var(--primary-dark);
    }

    .btn:active { transform: translateY(0) scale(.98); }

    .socials {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid #eef2f7;
    }

    .socials a {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #64748b;
      background: #f1f5f9;
      transition: all .25s ease;
    }

    .socials a:hover {
      color: #fff;
      transform: translateY(-3px);
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      box-shadow: 0 10px 18px -8px rgba(99, 102, 241, .9);
    }

    .socials svg { width: 18px; height: 18px; }

    @media (max-width: 420px) {
      .banner   { height: 100px; }
      .avatar   { width: 92px; height: 92px; margin-top: -46px; font-size: 32px; }
      .content  { padding: 16px 22px 28px; }
      .name     { font-size: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="banner"></div>
    <div class="avatar">名</div>

    <div class="content">
      <h1 class="name">格洛</h1>
      <div class="role">素材分享</div>

      <p class="bio">
        仅用来分享素材，请勿商用
      </p>

      <div class="tags">
        <span class="tag">HTML / CSS</span>
        <span class="tag">JavaScript</span>
        <span class="tag">Vue</span>
        <span class="tag">UI 设计</span>
      </div>

      <div class="actions">
        <a class="btn btn--primary" href="mailto:you@example.com">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2.5"/>
            <path d="m3.5 7 8.5 6 8.5-6"/>
          </svg>
          发邮件
        </a>
        <a class="btn btn--ghost" href="#">查看作品集</a>
      </div>

      <div class="socials">
        <a href="mailto:you@example.com" aria-label="邮箱" title="邮箱">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2.5"/>
            <path d="m3.5 7 8.5 6 8.5-6"/>
          </svg>
        </a>
        <a href="https://github.com/" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 .5a12 12 0 0 0-3.79 23.4c.6.1.82-.26.82-.58v-2c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.84 2.81 1.31 3.5 1 .1-.78.42-1.31.76-1.61-2.67-.3-5.47-1.34-5.47-5.95 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.12-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.28-1.55 3.29-1.23 3.29-1.23.66 1.66.25 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.62-2.81 5.64-5.49 5.94.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.83.58A12 12 0 0 0 12 .5z"/>
          </svg>
        </a>
        <a href="tel:+8613800000000" aria-label="电话" title="电话">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
        </a>
      </div>
    </div>
  </main>

</body>
</html>
